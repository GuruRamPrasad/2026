# Secret: sensitive configuration (here, database credentials).
# Values in stringData are plain text in this file and only base64-encoded in etcd
# unless encryption at rest is enabled. Do not commit real secrets to Git; use a
# secret manager or a tool such as Sealed Secrets or External Secrets instead.
apiVersion: v1
kind: Secret
metadata:
  name: my-app-secret
  namespace: my-app
type: Opaque
stringData:
  DB_USER: "app_user"
  DB_PASSWORD: "change-me"
