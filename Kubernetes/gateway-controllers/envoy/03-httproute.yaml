# HTTPRoute: application-owned routing rules attached to the Gateway.
# Sends my-app.example.com traffic to the my-app Service; /api gets an extra header.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app-envoy
  namespace: my-app
spec:
  parentRefs:
    - name: envoy-gateway
  hostnames:
    - my-app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Route
                value: api
      backendRefs:
        - name: my-app
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-app
          port: 80
