# NetworkPolicy: lets the Kong proxies (in the "kong" namespace) reach the app
# Pods on port 8080. NetworkPolicies add up: if you apply more than one
# controller folder, each controller is allowed. Only enforced if the CNI
# plugin supports NetworkPolicy (e.g. Calico, Cilium).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: my-app-allow-from-kong
  namespace: my-app
spec:
  podSelector:
    matchLabels:
      app: my-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kong
      ports:
        - protocol: TCP
          port: 8080
