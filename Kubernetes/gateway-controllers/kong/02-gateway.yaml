# Gateway: the entry point (listener on port 80 for *.example.com),
# normally owned by the infrastructure team.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kong-gateway
  namespace: my-app
spec:
  gatewayClassName: kong
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          # Only routes in this namespace may attach. Use "Selector" to let
          # selected application namespaces attach to a shared Gateway.
          from: Same
