# Ingress: routes my-app.example.com to the my-app Service.
# Implemented by the F5 NGINX Ingress Controller (README Section 8.3),
# whose IngressClass is named "nginx".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app
  namespace: my-app
spec:
  ingressClassName: nginx
  # Uncomment to terminate TLS with a certificate stored in a Secret
  # (for example, one issued by cert-manager).
  # tls:
  #   - hosts:
  #       - my-app.example.com
  #     secretName: my-app-tls
  rules:
    - host: my-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-app
                port:
                  name: http
