# RoleBinding: grants the Role to the app's ServiceAccount, within my-app only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: my-app-pod-and-config-reader
  namespace: my-app
subjects:
  - kind: ServiceAccount
    name: my-app
    namespace: my-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-and-config-reader
