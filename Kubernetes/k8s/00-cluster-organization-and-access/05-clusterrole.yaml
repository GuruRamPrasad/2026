# ClusterRole: cluster-wide permissions. Allows read-only access to cluster-scoped
# resources (Nodes, Namespaces) that a namespaced Role cannot cover.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
