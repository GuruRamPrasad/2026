# ClusterRoleBinding: grants the ClusterRole across the whole cluster.
# Here it is given to a group of users; the group name comes from your
# authentication provider (e.g. an OIDC group). Change it to match yours.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-team-cluster-viewer
subjects:
  - kind: Group
    name: dev-team
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-viewer
